name: Observability Scrape

# Re-renders the Grafana-style dashboard + recent activity feed.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/observe.py", ".github/workflows/observe.yml"]

concurrency:
  group: chaos-cluster   # shares the lock with the chaos game so README writes never race
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape & render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/observe.py

      - name: Commit
        run: |
          git config user.name "observability-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg README.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: refresh telemetry [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
