o',Menlo,monospace" font-size="11.5" fill="#c9d1d9">Python</text></g><g transform="translate(514,0)"><rect width="39" height="22" rx="11" fill="#00D4FF" fill-opacity=".12" stroke="#00D4FF" stroke-opacity=".45"/><text x="19.5" y="15" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#c9d1d9">AWS</text></g></g>
